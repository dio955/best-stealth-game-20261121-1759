<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Ledger — a stealth game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c0a10;
    color: #e8e4f0;
    font-family: sans-serif;
    min-height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0 0 4px 0;
    font-family: serif;
    letter-spacing: 4px;
    color: #ffd75e;
    font-size: 28px;
  }
  p.tagline {
    margin: 0 0 12px 0;
    color: #9a93ad;
    font-size: 14px;
  }
  canvas {
    display: block;
    width: 960px;
    max-width: 96vw;
    height: auto;
    border: 2px solid #4a4356;
    background: #17141c;
    cursor: crosshair;
  }
  p.controls {
    margin: 12px 0 0 0;
    color: #9a93ad;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>
<h1>NIGHT LEDGER</h1>
<p class="tagline">A stealth game — slip past the guards, reach the green exit unseen.</p>
<canvas id="game" width="960" height="600"></canvas>
<p class="controls">WASD / Arrows — move &nbsp;·&nbsp; Shift — run (louder) &nbsp;·&nbsp; Click — toss a coin &nbsp;·&nbsp; M — mute &nbsp;·&nbsp; R — restart</p>
<script src="src/config.js"></script>
<script src="src/levels.js"></script>
<script src="src/audio.js"></script>
<script src="src/guards.js"></script>
<script src="src/player.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
